name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @evensurface/paginate pack --pack-destination .artifacts
      - run: pnpm --filter @evensurface/paginate-drizzle pack --pack-destination .artifacts
      - run: pnpm --filter @evensurface/paginate-better-auth pack --pack-destination .artifacts
      - name: Use Node.js 22.18
        uses: actions/setup-node@v4
        with:
          node-version: 22.18
      - name: Verify package runtime compatibility
        run: |
          node --input-type=module --eval "
            import assert from 'node:assert/strict'
            import * as pager from './packages/paginate/dist/index.mjs'
            import * as drizzle from './packages/adapter/drizzle/dist/index.mjs'
            import * as betterAuth from './packages/adapter/better-auth/dist/index.mjs'
            assert.equal(pager.parsePage('3'), 3)
            assert.equal(pager.parseOffset('3'), 3)
            assert.equal(typeof pager.paginateOffset, 'function')
            assert.equal(typeof pager.paginateCursor, 'function')
            assert.equal(typeof drizzle.paginateDrizzle, 'function')
            assert.equal(typeof drizzle.paginateDrizzleOffset, 'function')
            assert.equal(typeof drizzle.paginateDrizzleCursor, 'function')
            assert.equal(typeof betterAuth.paginateBetterAuth, 'function')
            assert.equal(typeof betterAuth.paginateBetterAuthOffset, 'function')
          "
          node --eval "
            const assert = require('node:assert/strict')
            const pager = require('./packages/paginate/dist/index.cjs')
            const drizzle = require('./packages/adapter/drizzle/dist/index.cjs')
            const betterAuth = require('./packages/adapter/better-auth/dist/index.cjs')
            assert.equal(pager.parsePage('3'), 3)
            assert.equal(pager.parseOffset('3'), 3)
            assert.equal(typeof pager.paginateOffset, 'function')
            assert.equal(typeof pager.paginateCursor, 'function')
            assert.equal(typeof drizzle.paginateDrizzle, 'function')
            assert.equal(typeof drizzle.paginateDrizzleOffset, 'function')
            assert.equal(typeof drizzle.paginateDrizzleCursor, 'function')
            assert.equal(typeof betterAuth.paginateBetterAuth, 'function')
            assert.equal(typeof betterAuth.paginateBetterAuthOffset, 'function')
          "
